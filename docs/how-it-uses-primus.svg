<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" width="760" height="304" role="img" aria-label="A proof made in the browser is checked onchain before the seal is saved" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs><text x="24" y="32" font-size="15" font-weight="600" fill="#1f2328">A proof made in the browser is checked onchain before the seal is saved</text><g fill="none" stroke="#8c959f" stroke-width="1.25"><path d="M232 116H264" marker-end="url(#arrow)"/><path d="M472 116H504" marker-end="url(#arrow)"/><path d="M608 152V208" marker-end="url(#arrow)"/><path d="M504 244H472" marker-end="url(#arrow)"/></g><text x="248" y="70" text-anchor="middle" font-size="11.5" fill="#59636e">sign request</text><text x="488" y="70" text-anchor="middle" font-size="11.5" fill="#59636e">signed request</text><text x="618" y="184" text-anchor="start" font-size="11.5" fill="#59636e">register(proof)</text><text x="488" y="198" text-anchor="middle" font-size="11.5" fill="#59636e">seal saved</text><rect x="24" y="80" width="208" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"/><text x="36" y="104" font-weight="600" fill="#1f2328">HandleSeal web app</text><text x="36" y="124" font-size="11.5" fill="#59636e">Builds the request for the</text><text x="36" y="140" font-size="11.5" fill="#59636e">X template and the wallet</text><rect x="264" y="80" width="208" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"/><text x="276" y="104" font-weight="600" fill="#1f2328">App server, /api/sign</text><text x="276" y="124" font-size="11.5" fill="#59636e">Signs it with the appSecret</text><text x="276" y="140" font-size="11.5" fill="#59636e">for this template only</text><rect x="504" y="80" width="208" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"/><text x="516" y="104" font-weight="600" fill="#1f2328">Primus extension</text><text x="516" y="124" font-size="11.5" fill="#59636e">zkTLS session with api.x.com</text><text x="516" y="140" font-size="11.5" fill="#59636e">proves screen_name only</text><rect x="504" y="208" width="208" height="72" rx="8" fill="#fd4c00" fill-opacity="0.12" stroke="#fd4c00" stroke-width="2"/><text x="516" y="232" font-weight="600" fill="#1f2328">XWalletRegistry</text><text x="516" y="252" font-size="11.5" fill="#1f2328">Primus verifier checks the</text><text x="516" y="268" font-size="11.5" fill="#1f2328">signature, then 5 own checks</text><rect x="264" y="208" width="208" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c959f" stroke-width="1.25"/><text x="276" y="232" font-weight="600" fill="#1f2328">Any app reads it</text><text x="276" y="252" font-size="11.5" fill="#59636e">walletOf(handle)</text><text x="276" y="268" font-size="11.5" fill="#59636e">handleOf(wallet)</text></svg>
